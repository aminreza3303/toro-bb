[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torob-business-demo"
version = "0.1.0"
description = "A reproducible B2B offer-normalization and sourcing demo"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
torob-business = "torob_business.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
